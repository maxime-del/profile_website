<!DOCTYPE html>
<html lang="en" class="js-loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — Maxime Danion</title>
  <meta name="description" content="Maxime Danion, IT Student.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">

<body data-page="article">
  <script src="assets/js/data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>Layout.header()</script>

      <header class="px-base a-head">

        <h1 class="text-big" data-render="a-title" data-reveal></h1>

      <div class="px-base grid-12">

    <section class="px-base section-gap">
      <div class="section-head">
        <h2 data-reveal>More writing</h2>
        <a href="writing.html" class="cta-2 grey hide-mobile">All articles <span class="arrow"><i>→</i><i>→</i></span></a>

      <div class="cards cards-4" data-render="a-more"></div>
    </section>
  </main>

  <script>Layout.footer()</script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
